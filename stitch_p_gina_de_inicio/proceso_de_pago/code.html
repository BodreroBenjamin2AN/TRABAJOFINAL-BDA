<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>FitFlex - Checkout</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0b73da",
            "background-light": "#f5f7f8",
            "background-dark": "#101922",
          },
          fontFamily: {
            "display": ["Lexend"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="flex flex-col min-h-screen">
<header class="border-b border-gray-200 dark:border-gray-700">
<div class="container mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-20">
<div class="flex items-center gap-4">
<svg class="h-8 w-8 text-gray-900 dark:text-white" fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
<h2 class="text-2xl font-bold text-gray-900 dark:text-white">FitFlex</h2>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">New Arrivals</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">Men</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">Women</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">Accessories</a>
<a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary" href="#">Sale</a>
</nav>
<div class="flex items-center gap-2">
<button class="flex items-center justify-center h-10 w-10 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700">
<span class="material-symbols-outlined">search</span>
</button>
<button class="flex items-center justify-center h-10 w-10 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700">
<span class="material-symbols-outlined">person</span>
</button>
<button class="flex items-center justify-center h-10 w-10 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700">
<span class="material-symbols-outlined">shopping_bag</span>
</button>
</div>
</div>
</div>
</header>
<main class="flex-grow">
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
<div class="max-w-xl mx-auto">
<div class="mb-8">
<div class="flex items-center text-sm text-gray-500 dark:text-gray-400">
<a class="hover:text-primary" href="#">Bag</a>
<span class="mx-2">/</span>
<a class="hover:text-primary" href="#">Checkout</a>
<span class="mx-2">/</span>
<span class="text-gray-800 dark:text-gray-200 font-medium">Payment</span>
</div>
<div class="mt-4">
<p class="text-sm font-medium text-gray-800 dark:text-gray-200">Checkout</p>
<div class="mt-2 flex items-center gap-2">
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 66%;"></div>
</div>
<p class="text-sm text-gray-500 dark:text-gray-400 whitespace-nowrap">Step 2 of 3</p>
</div>
</div>
</div>
<h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6">Payment</h1>
<div class="space-y-4">
<label class="flex items-center gap-4 p-4 rounded-lg border border-gray-300 dark:border-gray-700 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary cursor-pointer">
<input checked="" class="h-5 w-5 border-gray-300 dark:border-gray-600 text-primary focus:ring-primary" name="payment-method" type="radio"/>
<span class="text-sm font-medium text-gray-800 dark:text-gray-200">Credit Card</span>
</label>
<label class="flex items-center gap-4 p-4 rounded-lg border border-gray-300 dark:border-gray-700 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary cursor-pointer">
<input class="h-5 w-5 border-gray-300 dark:border-gray-600 text-primary focus:ring-primary" name="payment-method" type="radio"/>
<span class="text-sm font-medium text-gray-800 dark:text-gray-200">PayPal</span>
</label>
<label class="flex items-center gap-4 p-4 rounded-lg border border-gray-300 dark:border-gray-700 has-[:checked]:border-primary has-[:checked]:ring-2 has-[:checked]:ring-primary cursor-pointer">
<input class="h-5 w-5 border-gray-300 dark:border-gray-600 text-primary focus:ring-primary" name="payment-method" type="radio"/>
<span class="text-sm font-medium text-gray-800 dark:text-gray-200">Gift Card</span>
</label>
</div>
<div class="mt-8 space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="card-number">Card Number</label>
<input class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary placeholder-gray-400 dark:placeholder-gray-500" id="card-number" placeholder="Enter card number" type="text"/>
</div>
<div class="grid grid-cols-2 gap-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="expiration-date">Expiration Date</label>
<input class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary placeholder-gray-400 dark:placeholder-gray-500" id="expiration-date" placeholder="MM/YY" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="cvv">CVV</label>
<input class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary placeholder-gray-400 dark:placeholder-gray-500" id="cvv" placeholder="CVV" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="name-on-card">Name on Card</label>
<input class="block w-full rounded-lg border-gray-300 dark:border-gray-600 bg-background-light dark:bg-background-dark focus:border-primary focus:ring-primary placeholder-gray-400 dark:placeholder-gray-500" id="name-on-card" placeholder="Enter name" type="text"/>
</div>
<div class="flex items-center">
<input class="h-4 w-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary" id="save-card" type="checkbox"/>
<label class="ml-2 block text-sm text-gray-800 dark:text-gray-200" for="save-card">Save this card for future purchases</label>
</div>
</div>
<div class="mt-10">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
              Continue to Review
            </button>
</div>
</div>
</div>
</main>
</div>

</body></html>
